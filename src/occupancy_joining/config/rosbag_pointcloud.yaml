input:
  type: bag
bag:
  scan_topic: /points
  odom_source: auto
  odom_topic: /odom
  tf_topic: /tf
  tf_static_topic: /tf_static
  odom_frame: odom
  projection_frame: null
  min_height: -0.2
  max_height: 0.2
  bins: 720
  slam_config: slam_toolbox.yaml
submaps:
  scans_per_submap: 100
  local_resolution: 0.1
optimizer:
  model: matlab_inverse
  global_resolution: 0.15
  max_iterations: 70
display:
  resolution: 0.05
